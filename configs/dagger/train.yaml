# Standalone configuration: scripts/dagger/train.py --config configs/dagger/train.yaml
# Teacher run params/agent.yaml and params/env.yaml are discovered alongside the checkpoint.
teacher:
  checkpoint: null
  agent_config: null
  env_config: null

training:
  seed: 42
  num_envs: 4096  # PER GPU/rank; two DDP ranks collect 8192 environments total.
  rollout_steps: 16
  num_learning_epochs: 2
  num_mini_batches: 32  # 2048 samples/rank/update; DDP global batch=4096, still 64 updates.
  micro_batch_size: 128  # PER RANK; 16 backwards, one gradient sync and optimizer step.
  num_iterations: 11000
  cnn_lr: 0.0001
  transferred_lr: 0.00001
  weight_decay: 0.0001
  max_grad_norm: 1.0
  save_interval: 100
  keep_last_checkpoints: 2
  log_interval: 10

# Inherit teacher scene, actions, observations, references, rewards, and randomizations.
# Allowed overrides: motion files/RSI/debug_vis, events, and proprio corruption.
env_overrides:
  commands:
    motion:
      rsi: true
