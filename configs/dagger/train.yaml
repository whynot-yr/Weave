# Current student perception + PPO/BC from commit 3904770.
# Goal MLPs and CNN are new; proprio, SimBa and critic initialize from the teacher.
teacher:
  checkpoint: null
  agent_config: null
  env_config: null

student:
  observation_mode: terminal_goal   # Last frame of the selected clip, regardless of RSI start.

training:
  seed: 42
  num_envs: 4096                # PER GPU/rank; 8192 total on two GPUs.
  rollout_steps: 32
  num_learning_epochs: 5
  num_mini_batches: 4           # 32768 samples/rank/update; 20 updates/iteration.
  micro_batch_size: 128         # PER RANK; 256 backwards per optimizer update.
  num_iterations: 11000

  init_noise_std: 0.2
  bc_coef: 1.0
  bc_coef_anneal_iters: 6000
  gamma: 0.99
  gae_lambda: 0.95
  clip_param: 0.2
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  entropy_coef: 0.0005
  learning_rate: 0.0001         # Existing Muon + AdamW, as in 3904770.
  schedule: adaptive
  desired_kl: 0.01
  weight_decay: 0.01
  max_grad_norm: 1.0

  save_interval: 100
  keep_last_checkpoints: null   # Keep every numbered checkpoint.
  log_interval: 10

# Teacher/Critic references, rewards, terminations and depth processing stay unchanged.
env_overrides:
  commands:
    motion:
      rsi: true
