# @package _global_
#
# DAgger distillation: distill the teacher tracker into a goal-conditioned SimBa student.
#
# Usage (point --load_run/--checkpoint at a trained G1-Inspire-HOI-v0 tracker run; its actor is
# auto-loaded as the frozen teacher):
#   python scripts/rsl_rl/train.py --task=G1-Inspire-HOI-Distill-v0 \
#       --config-dir ./configs/distill --config-name train \
#       --load_run <TRACKER_RUN_DIR> --checkpoint <model_XXXX.pt>
#

defaults:
  - G1-Inspire-HOI-Distill-v0
  - _self_

# =============================================================================
# Environment
# =============================================================================

env:
  scene:
    num_envs: 4096

  commands:
    motion:
      motion_files:
        - ./data/test/smalltable_42clip.npz
      rsi: true
      gap: [50, null]

  # ---- rewards ----
  rewards:
    motion_anchor_pos:    { weight: 1.0, params: { command_name: motion, std: 0.3 } }
    motion_anchor_ori:    { weight: 1.0, params: { command_name: motion, std: 0.4 } }
    motion_body_pos:      { weight: 1.0, params: { command_name: motion, std: 0.3 } }
    motion_body_ori:      { weight: 1.0, params: { command_name: motion, std: 0.4 } }
    object_pos:           { weight: 2.0, params: { command_name: motion, std: 0.2 } }
    object_ori:           { weight: 2.0, params: { command_name: motion, std: 0.3 } }
    hand_obj_rel_pos:
      weight: 2.0
      params:
        command_name: motion
        hand_body_names: [".*_thumb_intermediate", ".*_thumb_distal", ".*_index_intermediate", ".*_middle_intermediate", ".*_ring_intermediate", ".*_pinky_intermediate"]
        std: 0.1
    contact:
      weight: 2.0
      params:
        command_name: motion
        sensor_name: contact_sensor
        hand_body_names: [".*_thumb_intermediate", ".*_thumb_distal", ".*_index_intermediate", ".*_middle_intermediate", ".*_ring_intermediate", ".*_pinky_intermediate"]
        saturate_force: 5.0
    action_rate_l2:       { weight: -0.1 }
    feet_slide:           { weight: -1.0 }
    joint_limit:          { weight: -10.0 }

  # ---- termination thresholds ----
  terminations:
    anchor_pos:    { params: { command_name: motion, threshold: 0.25 } }
    anchor_ori:    { params: { command_name: motion, threshold: 0.8  } }
    object_pos:    { params: { command_name: motion, threshold: 0.25 } }
    object_ori:    { params: { command_name: motion, threshold: 0.3  } }
    ee_body_pos:
      params:
        command_name: motion
        threshold: 0.25
        body_names:
          - left_ankle_roll_link
          - right_ankle_roll_link
          - left_wrist_yaw_link
          - right_wrist_yaw_link
    bad_contact:
      params:
        command_name: motion
        sensor_name: contact_sensor
        hand_body_names: [".*_thumb_intermediate", ".*_thumb_distal", ".*_index_intermediate", ".*_middle_intermediate", ".*_ring_intermediate", ".*_pinky_intermediate"]
        max_lost_frames: 10

# =============================================================================
# Agent (distillation + RL: SimBa actor-critic + frozen teacher + MuonPPODistill)
# =============================================================================

agent:
  experiment_name: g1_inspire_hoi_distill
  num_steps_per_env: 32
  max_iterations: 100000
  save_interval: 200

  policy:
    init_noise_std: 0.5
    actor_hidden_dim: 1024
    critic_hidden_dim: 1024
    teacher_hidden_dim: 1024
    actor_num_blocks: 1
    critic_num_blocks: 2
    teacher_num_blocks: 1
    expansion: 4
    latent_dim: 128
    encoder_hidden_dims:
      ref_motion_body: { type: mlp, hidden_dims: [512, 256] }
      ref_motion_object: { type: mlp, hidden_dims: [256] }
      object_state: { type: mlp, hidden_dims: [256] }
      robot_proprio: { type: mlp, hidden_dims: [256] }
      robot_privileged: { type: mlp, hidden_dims: [256] }
      goal_root: { type: mlp, hidden_dims: [256] }
      goal_object: { type: mlp, hidden_dims: [256] }
    actor_obs_normalization: true
    critic_obs_normalization: true
    teacher_obs_normalization: true

  algorithm:
    bc_coef: 0.3
    bc_coef_min: 0.05
    bc_coef_anneal_iters: 6000
    learning_rate: 1.0e-4
    schedule: adaptive
    desired_kl: 0.01
    entropy_coef: 5.0e-4
    num_learning_epochs: 5
    num_mini_batches: 4
    gamma: 0.99
    lam: 0.95
    clip_param: 0.2
    use_clipped_value_loss: true
    value_loss_coef: 1.0
    max_grad_norm: 1.0
    weight_decay: 0.01
