# @package _global_

# Usage (checkpoint resolved under logs/rsl_rl/g1_inspire_hoi_distill, latest run/checkpoint):
#   python scripts/rsl_rl/play.py --task=G1-Inspire-HOI-Distill-v0 \
#       --config-dir ./configs/distill --config-name play

defaults:
  - train
  - _self_

env:
  scene:
    num_envs: 1

  commands:
    motion:
      motion_files:
        - ./data/test/smalltable_42clip.npz
      rsi: false
      gap: [50, 200]
      joint_position_range: [0.0, 0.0]
      pose_range:
        x: [0.0, 0.0]
        y: [0.0, 0.0]
        z: [0.0, 0.0]
        roll: [0.0, 0.0]
        pitch: [0.0, 0.0]
        yaw: [0.0, 0.0]
      velocity_range:
        x: [0.0, 0.0]
        y: [0.0, 0.0]
        z: [0.0, 0.0]
        roll: [0.0, 0.0]
        pitch: [0.0, 0.0]
        yaw: [0.0, 0.0]
