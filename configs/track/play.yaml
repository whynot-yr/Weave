# @package _global_
#
# Evaluation / playback config. Inherits everything from train.yaml and
# only overrides what's different at eval time (single env, RSI off).
#
# Usage:
#   python scripts/rsl_rl/play.py --task=G1-Inspire-HOI-v0 \
#       --config-dir ./configs/track --config-name play
#
# Switch object: edit motion_files below, or override inline:
#   ... --config-name play env.commands.motion.motion_files=[./data/example_data/floorlamp.npz]

defaults:
  - train
  - _self_

env:
  scene:
    num_envs: 1

  commands:
    motion:
      motion_files:
        # - ./data/test_prepend/clothesstand_29clip_var5.npz
        # - ./data/test_prepend/floorlamp_33clip_var5.npz
        # - ./data/test_prepend/largebox_46clip_var5.npz
        # - ./data/test_prepend/largetable_36clip_var5.npz
        # - ./data/test_prepend/smallbox_24clip_var5.npz
        # - ./data/test_prepend/smalltable_42clip_var5.npz
        # - ./data/test_prepend/trashcan_35clip_var5.npz
        # - ./data/test_prepend/tripod_30clip_var5.npz
        # - ./data/test_prepend/whitechair_35clip_var5.npz
        # - ./data/test_prepend/woodchair_46clip_var5.npz
        - ./data/test_prepend/smalltable_42clip_var5.npz
      rsi: false
      joint_position_range: [0.0, 0.0]
      pose_range:
        x: [0.0, 0.0]
        y: [0.0, 0.0]
        z: [0.0, 0.0]
        roll: [0.0, 0.0]
        pitch: [0.0, 0.0]
        yaw: [0.0, 0.0]
      velocity_range:
        x: [0.0, 0.0]
        y: [0.0, 0.0]
        z: [0.0, 0.0]
        roll: [0.0, 0.0]
        pitch: [0.0, 0.0]
        yaw: [0.0, 0.0]
