# @package _global_
#
# Evaluation / playback config. Inherits everything from train.yaml and
# only overrides what's different at eval time (single env, RSI off).
#
# Usage:
#   python scripts/rsl_rl/play.py --task=G1-Inspire-HOI-v0 \
#       --config-dir ./configs/track --config-name play
#
# Switch object: edit motion_files below, or override inline:
#   ... --config-name play env.commands.motion.motion_files=[./data/example_data/floorlamp.npz]

defaults:
  - train
  - _self_

env:
  scene:
    num_envs: 1

  commands:
    motion:
      motion_files:
        # - ./data/test/clothesstand_29clip_var5.npz
        - ./data/test/floorlamp_033_var5.npz
        # - ./data/test/largebox_46clip_var5.npz
        # - ./data/test/largetable_36clip_var5.npz
        # - ./data/test/smallbox_24clip_var5.npz
        # - ./data/test/smalltable_42clip_var5.npz
        # - ./data/test/tripod_30clip_var5.npz
        # - ./data/test/whitechair_35clip_var5.npz
        # - ./data/test/woodchair_46clip_var5.npz
      rsi: false

agent:
  policy:
    compile: false
