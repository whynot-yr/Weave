# @package _global_
#
# Clip-wise evaluation config with eval_mode on.
#
# Usage:
#   python scripts/rsl_rl/eval.py --task=G1-Inspire-HOI-v0 --headless \
#       --config-dir ./configs/track --config-name eval

defaults:
  - train
  - _self_

env:
  commands:
    motion:
      motion_files:
        - ./data/test/smalltable_42clip_var5.npz
      eval_mode: true
      rsi: false
      debug_vis: false

agent:
  policy:
    compile: false     # exporters need .to("cpu"); a compiled forward breaks it
