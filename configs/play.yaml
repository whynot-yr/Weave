# @package _global_
#
# Evaluation / playback config. Inherits everything from train.yaml and
# only overrides what's different at eval time (single env, RSI off).
#
# Usage:
#   python scripts/rsl_rl/play.py --task=G1-Inspire-HOI-v0 \
#       --config-dir ./configs --config-name play
#
# Switch object: edit motion_files below, or override inline:
#   ... --config-name play env.commands.motion.motion_files=[./data/example_data/floorlamp.npz]

defaults:
  - train
  - _self_

env:
  scene:
    num_envs: 1

  commands:
    motion:
      motion_files:
        - ./data/train/clothesstand_31clip.npz
        - ./data/train/floorlamp_34clip.npz
        - ./data/train/largebox_48clip.npz
        - ./data/train/largetable_36clip.npz
        - ./data/train/smallbox_38clip.npz
        - ./data/train/smalltable_42clip.npz
        - ./data/train/suitcase_25clip.npz
        - ./data/train/trashcan_35clip.npz
        - ./data/train/tripod_34clip.npz
        - ./data/train/whitechair_38clip.npz
        - ./data/train/woodchair_54clip.npz
      rsi: false
      joint_position_range: [0.0, 0.0]
      pose_range:
        x: [0.0, 0.0]
        y: [0.0, 0.0]
        z: [0.0, 0.0]
        roll: [0.0, 0.0]
        pitch: [0.0, 0.0]
        yaw: [0.0, 0.0]
      velocity_range:
        x: [0.0, 0.0]
        y: [0.0, 0.0]
        z: [0.0, 0.0]
        roll: [0.0, 0.0]
        pitch: [0.0, 0.0]
        yaw: [0.0, 0.0]
